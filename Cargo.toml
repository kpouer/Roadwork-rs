[package]
name = "Roadwork"
version = "0.2.1"
edition = "2024"

[[bin]]
name = "Roadwork-rs"
path = "src/main.rs"

[lib]
name = "roadworkapp_lib"
crate-type = ["rlib"]
path = "src/lib.rs"

[package.metadata.bundle]
name = "Roadwork"
identifier = "com.kpouer.roadwork"
icon = ["media/icon.png", "media/AppIcon.icns"]

[dependencies]
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
egui = "0.34"
egui_extras = { version = "0.34", features = ["svg"] }
eframe = { version = "0.34", features = ["persistence"] }
egui-notify = "0.22.0"
jsonpath-rust = "1.0.4"
log = "0.4"
regex = "1.12"
reqwest = { version = "0.12", features = ["json"] }
roadwork-sync = { path = "crates/sync", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-normalization = "0.1.24"
urlencoding = "2.1.3"
walkers = "0.55.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
indexed_db_futures = { version = "0.6", features = ["serde"] }

[workspace]
members = ["crates/sync", "crates/webserver"]

[profile.dev.package."*"]
opt-level = 2
