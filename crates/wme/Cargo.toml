[package]
name = "roadwork-wme"
version = "0.5.0"
edition = "2024"
description = "WME (Waze Map Editor) userscript for Roadwork"
publish = false

[lib]
name = "roadwork_wme"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
roadwork-core = { path = "../core", version = "0.1.0" }
roadwork-service = { path = "../service", version = "0.1.0" }
roadwork-db = { path = "../db", version = "0.1.0" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
log = "0.4"
console_log = "1.0"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
