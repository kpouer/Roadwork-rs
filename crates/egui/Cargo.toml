[package]
name = "roadwork-egui"
version = "0.2.1"
edition = "2024"

[[bin]]
name = "Roadwork-rs"
path = "src/main.rs"

[lib]
name = "roadwork_egui"
crate-type = ["rlib"]
path = "src/lib.rs"

[package.metadata.bundle]
name = "Roadwork"
identifier = "com.kpouer.roadwork"
icon = ["../../media/icon.png", "../../media/AppIcon.icns"]

[dependencies]
chrono = "0.4"
egui = "0.34"
egui_extras = { version = "0.34", features = ["svg", "syntect"] }
eframe = { version = "0.34", features = ["persistence"] }
egui-notify = "0.22.0"
log = "0.4"
reqwest = { version = "0.12", features = ["json"] }
roadwork-core = { path = "../core", version = "0.1.0" }
roadwork-service = { path = "../service", version = "0.1.0" }
roadwork-sync = { path = "../sync", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkers = "0.55.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"
