[package]
name = "roadwork-egui"
version = "0.2.1"
edition = "2024"

[[bin]]
name = "Roadwork-rs"
path = "src/main.rs"

[lib]
name = "roadwork_egui"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
egui = "0.34"
egui_extras = { version = "0.34", features = ["svg", "syntect"] }
eframe = { version = "0.34", features = ["persistence"] }
egui-notify = "0.22.0"
js-sys = "0.3"
log = "0.4"
reqwest = { version = "0.12", features = ["json"] }
roadwork-core = { path = "../core", version = "0.1.0" }
roadwork-service = { path = "../service", version = "0.1.0" }
roadwork-sync = { path = "../sync", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkers = "0.55.0"
wasm-bindgen = { version = "0.2", features = ["std"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "HtmlCanvasElement", "MessageEvent"] }

